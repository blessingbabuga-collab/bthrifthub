name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build:dev + tanstack drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check TanStack router/start version alignment
        run: bun run check:tanstack

      - name: Build (dev)
        run: bun run build:dev